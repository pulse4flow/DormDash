name: Operations CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dormdash_test
          POSTGRES_PASSWORD: dormdash_test
          POSTGRES_DB: dormdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dormdash_test -d dormdash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dormdash_test:dormdash_test@127.0.0.1:5432/dormdash_test
      OPS_TEST_DATABASE_URL: postgresql://dormdash_test:dormdash_test@127.0.0.1:5432/dormdash_test
      OPS_TEST_BASE_URL: http://127.0.0.1:3000
      AUTH_SECRET: operations-ci-secret-at-least-32-characters
      ADMIN_REGISTRATION_KEY: local-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Start app and run HTTP integration tests
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/dormdash-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/dormdash-next.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/admin/login > /dev/null; then
              npm run test:ops
              exit $?
            fi
            sleep 1
          done
          exit 1
